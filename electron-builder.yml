appId: com.kurouna.elecmockolla
productName: elecmockolla
copyright: Copyright © 2026 kurouna

directories:
  output: release
  buildResources: build

files:
  - out/**
  - resources/**
  - package.json

# win/mac/linux icons are all derived from build/icon.png, which scripts/gen-icon.mjs
# renders from build/icon.svg (the elec series icon with the "E" badge).
asar: true
compression: normal
# No native modules: nothing to rebuild, and every platform can be packaged from any runner.
npmRebuild: false
forceCodeSigning: false

publish:
  provider: github
  owner: kurouna
  repo: elecmockolla
  # Assets go to the pre-release the release workflow creates for the tag; a person
  # promotes it to a full release.
  releaseType: prerelease
  # No latest*.yml: there is no auto-updater to read them, and parallel jobs would
  # overwrite each other's copy.
  publishAutoUpdate: false

artifactName: elecmockolla-${os}-${arch}-${version}.${ext}

# Targets name no arch: an arch listed here overrides the command line. The arch comes
# from --x64 / --arm64, or the host's when none is given.

win:
  target:
    - nsis
    - zip

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  # Blockmaps only serve electron-updater's differential downloads, which are unused.
  differentialPackage: false

dmg:
  # No blockmap, for the same reason as nsis.differentialPackage.
  writeUpdateInfo: false

mac:
  category: public.app-category.developer-tools
  target:
    - dmg

linux:
  target:
    - AppImage
    - deb
  category: Development
  # The .deb control file needs a maintainer; without one electron-builder asks for
  # an author email in package.json, and none is published for this project.
  maintainer: kurouna (https://github.com/kurouna)
