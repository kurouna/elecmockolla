<?xml version="1.0" encoding="UTF-8"?>
<!--
  elecmockolla app icon - the master for every icon size (see scripts/gen-icon.mjs).

  Follows the elec series layout shared with elecxzy, elecxterm, elecdex and elecxmail:
  the app's own motif on a card, with the series "E" badge overlapping the
  bottom-left corner (a #0ea5e9 disc with a white rim and three rounded bars).

  elecmockolla's motif is a chat reply: a teal speech bubble holding the llama head
  of the app's title-bar logo (which also reads as an "M" for mock), with the reply
  streaming in below it, caret and all. The card is white and the bubble a solid
  block of teal, so at taskbar size it reads as one teal shape on white - apart from
  the dark panes of elecxterm and elecdex and the blue lines of elecxzy.
-->
<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>elecmockolla</title>
  <!-- Card, with the series' offset shadow for depth -->
  <rect x="44" y="24" width="184" height="216" rx="16" fill="#cbd5e1"/>
  <rect x="40" y="20" width="184" height="216" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- The reply bubble, tail down at the right -->
  <path d="M112 34h88a16 16 0 0 1 16 16v68a16 16 0 0 1-16 16h-10v20l-24-20h-54a16 16 0 0 1-16-16V50a16 16 0 0 1 16-16z" fill="#0d9488"/>
  <!-- The llama head (the title-bar logo): ears, and two eyes -->
  <path d="M122 114V74l16-16 16 16 16-16 16 16v40" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="142" cy="92" r="5.5" fill="#ffffff"/>
  <circle cx="166" cy="92" r="5.5" fill="#ffffff"/>

  <!-- The reply streaming in, with a caret -->
  <rect x="132" y="170" width="80" height="10" rx="5" fill="#99f6e4"/>
  <rect x="132" y="190" width="60" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="132" y="210" width="36" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="172" y="208" width="4" height="14" rx="2" fill="#0d9488"/>

  <!-- The elec series badge -->
  <circle cx="68" cy="180" r="52" fill="#0ea5e9" stroke="#ffffff" stroke-width="8"/>
  <path d="M44 156H92M44 180H76M44 204H92" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
</svg>
